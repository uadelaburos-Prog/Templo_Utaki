# ProjectConfig — Templo Utaki
# Generado via /uw-cmd-setup-project — Sesión 5 (2026-05-04)
# Fuente autoritativa: GDD v4.5 (Docs/GDD_TemploUtaki_v4.5.md) + manifest.json + ProjectVersion.txt

project_name: "Templo Utaki"
dev_stage: "post-alpha"          # Actualizado 2026-05-08
genre: "2D Platformer"
target_platforms:
  - Windows

# Unity
unity_version: "6000.0.30f1"
render_pipeline: "URP"            # URP 17.0.3
scripting_backend: "Mono"         # Mono (confirmado: MonoBleedingEdge en build prealpha)
ui_system: "UGUI"                 # UGUI 2.0.0 + TextMesh Pro 4.x (HUD cristales, fade, paneles)
folder_strategy: "type-based"     # Assets/Scripts, Assets/Sprites, Assets/Prefabs, etc.
networking: "none"
async_pattern: "Coroutines"       # Fades y lógica de nivel vía corrutinas (ver LevelManager_Spec.txt)
use_ecs_dots: false

# Architecture
architecture_pattern: "so-first"  # En práctica: MonoBehaviour + Singleton (LevelManager.Instance)
di_framework: "none"

# Packages instalados (manifest.json)
packages:
  com.unity.inputsystem: "1.11.2"
  com.unity.render-pipelines.universal: "17.0.3"
  com.unity.feature.2d: "2.0.1"      # Tilemap, Sprite tools, 2D Physics
  com.unity.ugui: "2.0.0"            # UGUI + TextMesh Pro 4.x
  com.unity.timeline: "1.8.7"
  com.unity.test-framework: "1.4.5"
  com.unity.collab-proxy: "2.12.4"   # PlasticSCM/Unity Version Control
  com.unity.ide.visualstudio: "2.0.22"
  com.unity.multiplayer.center: "1.0.0"

# Third-Party
third_party: []  # Sin assets de terceros importados

# Game Feel Middleware
feel_tools:
  tweening: "none"
  feedback_system: "Custom"   # Efectos vía código propio (flash sprites, shake)
  audio: "Unity"              # AudioMixer (Master.mixer), AudioManager.cs singleton
  camera: "Custom"            # CamaraScript.cs — lerp, look-behind, look-down

# Visual Plugins (ninguno adquirido)
visual_plugins:
  has_shapes: false
  has_true_shadow: false

# MCP Integrations
mcp:
  unity_mcp: false
  github_mcp: false
  linear_mcp: false
  notion_mcp: false

# Documentation & Task Management
task_management: "None"
documentation: "Markdown"    # CLAUDE1.md (GDD + spec), SESION.md, Docs/

# Behavior
ai_mode: "guided"
prompt_logging: false

# Rule Overrides — excepciones activas para este proyecto
rule_overrides:
  allow_ugui: true                        # proyecto usa UGUI 2.0, no UI Toolkit
  allow_coroutines_for_logic: true        # fade/reinicio vía corrutinas (LevelManager)
  allow_legacy_input_for_existing: true   # CLAUDE1.md indica legacy Input; InputSystem instalado
                                          # pero no migrado. Migrar = tarea futura Post-MVP.

